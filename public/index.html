<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Secure Password Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1d2330;--muted:#667085;--accent:#2f5bea;--border:#d9dde5;--err:#c0392b;--ok:#1e8e4e}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1e222b;--text:#e8ebf1;--muted:#9aa3b2;--accent:#6b8cff;--border:#323846;--err:#ff7b6b;--ok:#5fd18b}}
body{font-family:system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--text);margin:0;display:flex;justify-content:center;padding:32px 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:460px}
h1{font-size:20px;margin:0 0 4px}p.sub{color:var(--muted);margin:0 0 18px;font-size:14px}
label{display:block;font-size:13px;margin:12px 0 4px;color:var(--muted)}
input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px}
button{margin-top:14px;padding:9px 14px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:14px;cursor:pointer}
button.sec{background:transparent;color:var(--accent);border:1px solid var(--border)}button.danger{background:var(--err)}
.row{display:flex;gap:8px;flex-wrap:wrap}.msg{margin-top:14px;font-size:14px;min-height:20px}.err{color:var(--err)}.ok{color:var(--ok)}
.hidden{display:none}hr{border:0;border-top:1px solid var(--border);margin:20px 0}
</style></head><body><div class="card">
<h1>Secure Password Manager</h1><p class="sub" id="sub">Loading…</p>

<div id="lock" class="hidden">
  <label for="master">Master password</label>
  <input id="master" type="password" autocomplete="off">
  <button id="unlockBtn">Unlock</button>
</div>

<div id="vault" class="hidden">
  <label for="name">Domain</label><input id="name" placeholder="www.example.com" autocomplete="off">
  <label for="value">Password (max 64 characters)</label><input id="value" type="password" maxlength="64" autocomplete="off">
  <div class="row">
    <button id="saveBtn">Save</button>
    <button id="getBtn" class="sec">Look up</button>
    <button id="delBtn" class="danger">Remove</button>
    <button id="lockBtn" class="sec">Lock</button>
  </div>
</div>
<div class="msg" id="msg"></div>
</div>
<script>
let token=null, vaultExists=false;
const $=id=>document.getElementById(id);
function msg(t,cls){const m=$("msg");m.textContent=t||"";m.className="msg "+(cls||"")}
async function api(path,body){
  const r=await fetch("/api/"+path,{method:"POST",headers:{"Content-Type":"application/json","X-Session-Token":token||""},body:JSON.stringify(body||{})});
  const j=await r.json(); if(!r.ok) throw new Error(j.error||"Request failed"); return j;
}
function render(){
  $("lock").classList.toggle("hidden",!!token);$("vault").classList.toggle("hidden",!token);
  $("sub").textContent=token?"Vault unlocked":(vaultExists?"Enter your master password to unlock.":"No vault yet. Choose a master password to create one.");
  $("unlockBtn").textContent=vaultExists?"Unlock":"Create vault";
}
async function init(){const r=await fetch("/api/status",{method:"POST",headers:{"X-Session-Token":""},body:"{}"});vaultExists=(await r.json()).vaultExists;render()}
$("unlockBtn").onclick=async()=>{try{
  const j=await api(vaultExists?"unlock":"create",{password:$("master").value});
  token=j.token;vaultExists=true;$("master").value="";msg("");render();
}catch(e){msg(e.message,"err")}};
$("saveBtn").onclick=async()=>{try{await api("set",{name:$("name").value,value:$("value").value});$("value").value="";msg("Saved.","ok")}catch(e){msg(e.message,"err")}};
$("getBtn").onclick=async()=>{try{const j=await api("get",{name:$("name").value});
  if(j.value===null)msg("No entry for that domain.","err");else{$("value").type="text";$("value").value=j.value;msg("Found.","ok");setTimeout(()=>{$("value").type="password";$("value").value=""},10000)}
}catch(e){msg(e.message,"err")}};
$("delBtn").onclick=async()=>{try{const j=await api("remove",{name:$("name").value});msg(j.removed?"Removed.":"No entry for that domain.",j.removed?"ok":"err")}catch(e){msg(e.message,"err")}};
$("lockBtn").onclick=async()=>{try{await api("lock")}catch(e){}token=null;$("name").value=$("value").value="";msg("Locked.");render()};
$("master").addEventListener("keydown",e=>{if(e.key==="Enter")$("unlockBtn").click()});
init();
</script></body></html>
